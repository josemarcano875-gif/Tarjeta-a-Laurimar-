<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tarjeta para Laurimar</title>
  <style>
    :root{
      --card:#e9decf;
      --text:#2f2f2f;
      --muted:#6a6a6a;

      --bg1:#160018; --bg2:#4c063a; --bg3:#a10066;

      --h1:#b00020; --h2:#d60d2e; --h3:#ff2d55; --h4:#ff5b86; --h5:#ff9db2;

      --shadow: 0 18px 55px rgba(0,0,0,.40);
      --radius: 26px;
    }

    *{ box-sizing:border-box; }
    html, body { height:100%; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      overflow-x:hidden;
      background:
        radial-gradient(900px 540px at 20% 10%, rgba(255,45,139,.42), transparent 60%),
        radial-gradient(880px 600px at 85% 45%, rgba(255,80,160,.22), transparent 60%),
        radial-gradient(760px 520px at 40% 88%, rgba(255,0,120,.18), transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg2), var(--bg3));
    }

    .page{
      min-height:100%;
      display:grid;
      place-items:center;
      padding: 18px 14px calc(18px + env(safe-area-inset-bottom));
    }

    .card{
      width:min(980px, 94vw);
      background:var(--card);
      border-radius:var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.08);
      overflow:hidden;
      position:relative;
    }

    .errorBox{
      display:none;
      margin: 12px 16px 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(176,0,32,.12);
      border: 1px solid rgba(176,0,32,.28);
      color:#6a0011;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .errorBox.show{ display:block; }

    .headerInCard{
      display:flex; align-items:center; justify-content:center;
      gap:10px; padding: 14px 12px 6px;
      opacity:0; transform: translateY(-6px) scale(.98);
      transition: opacity .6s ease, transform .6s ease;
    }
    .headerInCard.show{ opacity:1; transform: translateY(0) scale(1); }

    .headerInCard .label{
      font-size:18px; font-weight:800; color:#8a1033;
      position:relative; padding-bottom:4px;
    }
    .headerInCard .label:after{
      content:""; position:absolute; left:0; right:0; bottom:0;
      height:2px; background: rgba(138,16,51,.45); border-radius:999px;
    }
    .smallHeart{
      width:18px; height:18px; background:#c3122f;
      transform: rotate(45deg); border-radius:4px; position:relative;
    }
    .smallHeart:before,.smallHeart:after{
      content:""; position:absolute; width:100%; height:100%;
      border-radius:50%; background:inherit;
    }
    .smallHeart:before{ left:-50%; }
    .smallHeart:after{ top:-50%; }

    .main{ padding: 16px 16px 10px; }

    .grid{
      display:grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 10px 10px;
      align-items:center;
    }
    @media (max-width: 860px){ .grid{ grid-template-columns:1fr; } }

    .letter{ padding: 4px 10px; }

    .dedication{
      margin: 0 0 10px;
      font-size: 18px;
      color: var(--muted);
      opacity:0;
      transform: translateY(8px);
      transition: opacity .6s ease, transform .6s ease;
    }
    .dedication.show{ opacity:1; transform: translateY(0); }

    .messageBox{ min-height: 200px; }
    .line{
      margin:0 0 12px;
      font-size: 19px;
      line-height:1.35;
      opacity:0;
      transform: translateY(10px);
      transition: opacity .55s ease, transform .55s ease;
    }
    .line.show{ opacity:1; transform: translateY(0); }

    .treeArea{ min-height: 360px; display:grid; place-items:center; padding: 0 6px 6px; }
    .tree{ position:relative; width:min(460px, 100%); height: 360px; }

    .canopyZone{
      position:absolute; left:50%; top:0; transform:translateX(-50%);
      width:390px; height:260px; pointer-events:none;
      filter: drop-shadow(0 14px 24px rgba(0,0,0,.10));
    }

    .treeBody{
      position:absolute; inset:0;
      transform-origin: 50% 100%;
      transform: scaleY(0);
      transition: transform 1.2s cubic-bezier(.2,.9,.2,1);
    }
    .treeBody.grow{ transform: scaleY(1); }

    .trunk{
      position:absolute; left:50%; bottom:22px; transform:translateX(-50%);
      width:50px; height:220px; border-radius:22px;
      background: linear-gradient(180deg, #7a4a2a, #5a2f1f 70%, #3a1b10);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.06);
      z-index:2;
    }

    .branches{
      position:absolute; left:50%; bottom:18px; transform: translateX(-50%);
      width:min(420px, 100%); height:auto;
      pointer-events:none; opacity:.98;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.10));
      z-index:1;
    }

    .ground{
      position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
      width:300px; height:18px; border-radius:999px;
      background: radial-gradient(circle at 50% 30%, rgba(0,0,0,.20), rgba(0,0,0,.06) 60%, transparent 70%);
      opacity:.8;
    }

    .bottomLine{
      height:2px; background: rgba(0,0,0,.18); margin: 8px 16px 0; border-radius:999px;
      opacity:0; transform: translateY(6px);
      transition: opacity .6s ease, transform .6s ease;
    }
    .bottomLine.show{ opacity:1; transform: translateY(0); }

    .heart{
      position:absolute; width:16px; height:16px;
      transform: translate(-50%, -50%) rotate(45deg);
      opacity:.95;
    }
    .heart::before,.heart::after{
      content:""; position:absolute; width:100%; height:100%;
      border-radius:50%; background:inherit;
    }
    .heart::before{ left:-50%; }
    .heart::after{ top:-50%; }

    .heart.canopy{ animation: canopyPulse 4.6s ease-in-out infinite; }
    @keyframes canopyPulse{
      0%,100%{ transform: translate(-50%,-50%) rotate(45deg) scale(1); }
      50%{ transform: translate(-50%,-50%) rotate(45deg) scale(1.03); }
    }

    .heart.fall{ animation: fallDown var(--dur, 8s) linear forwards; }
    @keyframes fallDown{
      0%{ opacity:0; transform: translate(-50%,-50%) rotate(45deg) scale(.85); }
      10%{ opacity:.95; }
      100%{ opacity:0; transform: translate(calc(-50% + var(--sway, 18px)), calc(-50% + 650px)) rotate(calc(45deg + var(--spin, 260deg))) scale(.9); }
    }

    .footer{
      padding: 10px 16px 16px;
      border-top:1px solid rgba(0,0,0,.10);
      opacity:0; transform: translateY(8px);
      transition: opacity .6s ease, transform .6s ease;
    }
    .footer.show{ opacity:1; transform: translateY(0); }

    .since{ margin:0 0 8px; color:var(--muted); font-size:15px; }
    .counterRow{ display:flex; flex-wrap:wrap; gap:10px 14px; align-items:baseline; font-variant-numeric: tabular-nums; }
    .chip{ display:flex; gap:8px; align-items:baseline; white-space:nowrap; }
    .chip b{ font-size:34px; line-height:1; color:#131313; }
    .chip span{ font-size:16px; color:#131313; }

    /* Overlay */
    .startOverlay{
      position:fixed; inset:0; z-index:9999;
      display:grid; place-items:center;
      padding: 18px 14px calc(18px + env(safe-area-inset-bottom));
      background:
        radial-gradient(900px 540px at 20% 10%, rgba(255,45,139,.42), transparent 60%),
        radial-gradient(880px 600px at 85% 45%, rgba(255,80,160,.22), transparent 60%),
        radial-gradient(760px 520px at 40% 88%, rgba(255,0,120,.18), transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg2), var(--bg3));
    }
    .startPanel{
      width:min(520px, 92vw);
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 22px 80px rgba(0,0,0,.45);
      border-radius: 18px;
      padding: 16px 14px 14px;
      text-align:center;
      color: rgba(255,255,255,.92);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .startTitle{ margin:2px 0 6px; font-size:20px; font-weight:900; }
    .startSub{ margin:0 0 10px; opacity:.9; font-size:13px; }
    .startBtn{
      border:0; background:transparent; cursor:pointer;
      padding: 8px; border-radius:999px;
      -webkit-tap-highlight-color: transparent;
    }
    .startBtn svg{ pointer-events:none; }
    .heartSvg{
      width: 92px; height: 84px; display:block;
      filter: drop-shadow(0 18px 26px rgba(0,0,0,.35));
      animation: beat 1.1s ease-in-out infinite;
    }
    @keyframes beat{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.10)} }
  </style>
</head>

<body>
  <div class="startOverlay" id="startOverlay">
    <div class="startPanel" id="startPanel">
      <div class="startTitle" id="startTitle">Feliz día del amor, mi vida:</div>
      <div class="startSub" id="startSub">Toca el corazón (o el cuadro) para abrir tu tarjeta</div>

      <button class="startBtn" id="startBtn" type="button">
        <svg class="heartSvg" viewBox="0 0 32 29.6" aria-hidden="true">
          <path fill="#ff2d55"
            d="M23.6,0c-3.4,0-6.4,2-7.6,4.9C14.8,2,11.8,0,8.4,0
               C3.8,0,0,3.8,0,8.4c0,9.1,16,21.2,16,21.2s16-12.1,16-21.2
               C32,3.8,28.2,0,23.6,0z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="page">
    <article class="card">
      <div id="errorBox" class="errorBox"></div>

      <header class="headerInCard" id="headerInCard">
        <span class="smallHeart" aria-hidden="true"></span>
        <span class="label">San Valentín</span>
      </header>

      <div class="main">
        <div class="grid">
          <section class="letter">
            <p class="dedication" id="dedication">Para mi ángel, Laurimar:</p>
            <div class="messageBox" id="messageBox"></div>
          </section>

          <section class="treeArea">
            <div class="tree">
              <div class="canopyZone" id="canopyZone"></div>

              <div class="treeBody" id="treeBody">
                <div class="trunk"></div>

                <svg class="branches" viewBox="0 0 420 320" aria-hidden="true">
                  <defs>
                    <linearGradient id="wood" x1="0" x2="1">
                      <stop offset="0" stop-color="#6a3a24"/>
                      <stop offset="1" stop-color="#3f1d12"/>
                    </linearGradient>
                  </defs>

                  <path d="M210 296 C210 252 210 214 210 174"
                        fill="none" stroke="url(#wood)" stroke-width="18" stroke-linecap="round"/>

                  <path d="M210 188 C196 168 178 150 156 132"
                        fill="none" stroke="url(#wood)" stroke-width="14" stroke-linecap="round"/>
                  <path d="M210 188 C210 165 210 148 210 128"
                        fill="none" stroke="url(#wood)" stroke-width="13" stroke-linecap="round"/>
                  <path d="M210 188 C224 168 242 150 264 132"
                        fill="none" stroke="url(#wood)" stroke-width="14" stroke-linecap="round"/>

                  <path d="M160 136 C132 120 110 108 84 96"
                        fill="none" stroke="url(#wood)" stroke-width="10" stroke-linecap="round"/>
                  <path d="M175 156 C146 154 120 146 96 134"
                        fill="none" stroke="url(#wood)" stroke-width="9" stroke-linecap="round"/>
                  <path d="M190 174 C168 184 150 198 134 216"
                        fill="none" stroke="url(#wood)" stroke-width="8" stroke-linecap="round"/>

                  <path d="M210 132 C192 116 178 98 166 78"
                        fill="none" stroke="url(#wood)" stroke-width="8" stroke-linecap="round" opacity=".9"/>
                  <path d="M210 132 C228 116 242 98 254 78"
                        fill="none" stroke="url(#wood)" stroke-width="8" stroke-linecap="round" opacity=".9"/>

                  <path d="M260 136 C288 120 310 108 336 96"
                        fill="none" stroke="url(#wood)" stroke-width="10" stroke-linecap="round"/>
                  <path d="M245 156 C274 154 300 146 324 134"
                        fill="none" stroke="url(#wood)" stroke-width="9" stroke-linecap="round"/>
                  <path d="M230 174 C252 184 270 198 286 216"
                        fill="none" stroke="url(#wood)" stroke-width="8" stroke-linecap="round"/>

                  <path d="M100 100 C80 90 62 76 46 58"
                        fill="none" stroke="url(#wood)" stroke-width="6" stroke-linecap="round" opacity=".8"/>
                  <path d="M320 100 C340 90 358 76 374 58"
                        fill="none" stroke="url(#wood)" stroke-width="6" stroke-linecap="round" opacity=".8"/>

                  <path d="M210 92 C198 76 186 62 170 48"
                        fill="none" stroke="url(#wood)" stroke-width="6" stroke-linecap="round" opacity=".75"/>
                  <path d="M210 92 C222 76 234 62 250 48"
                        fill="none" stroke="url(#wood)" stroke-width="6" stroke-linecap="round" opacity=".75"/>
                </svg>

                <div class="ground"></div>
              </div>
            </div>
          </section>
        </div>

        <div class="bottomLine" id="bottomLine"></div>
      </div>

      <footer class="footer" id="footer">
        <p class="since">Mi amor por ti comenzó hace...</p>
        <div class="counterRow" role="timer" aria-live="polite">
          <div class="chip"><b id="days">0</b><span>días</span></div>
          <div class="chip"><b id="hours">00</b><span>horas</span></div>
          <div class="chip"><b id="mins">00</b><span>minutos</span></div>
          <div class="chip"><b id="secs">00</b><span>segundos</span></div>
        </div>
      </footer>
    </article>
  </div>

  <script>
  (function(){
    "use strict";

    // Acode Play cache workaround: recargar 1 vez por sesión
    try{
      if (!sessionStorage.getItem("acode_reload_v1")) {
        sessionStorage.setItem("acode_reload_v1", "1");
        setTimeout(() => location.reload(), 60);
        return;
      }
    } catch(e){}

    const $ = (s, r=document) => r.querySelector(s);
    const errorBox = $("#errorBox");
    const showError = (err) => {
      errorBox.textContent = "Error:\n" + (err && err.stack ? err.stack : String(err));
      errorBox.classList.add("show");
    };

    try{
      const startOverlay = $("#startOverlay");
      const startPanel = $("#startPanel");
      const startBtn = $("#startBtn");
      const startTitle = $("#startTitle");
      const startSub = $("#startSub");

      const headerInCard = $("#headerInCard");
      const dedication = $("#dedication");
      const messageBox = $("#messageBox");
      const footer = $("#footer");
      const bottomLine = $("#bottomLine");
      const canopyZone = $("#canopyZone");
      const treeBody = $("#treeBody");

      const lines = [
        "Eres un ángel que Dios puso en mi camino como muestra de amor.",
        "Estoy orgulloso de lo que hemos logrado y de lo que seguiremos logrando.",
        "Espero que nunca te haga dudar del amor que siento por ti.",
        "Te amo, Lauri."
      ];

      let opened = false;

      function openCard(){
        if (opened) return;
        opened = true;

        startTitle.textContent = "Abriendo...";
        startSub.textContent = "Cargando animación...";

        startOverlay.style.display = "none";

        setTimeout(() => headerInCard.classList.add("show"), 120);
        setTimeout(() => treeBody.classList.add("grow"), 450);
        setTimeout(() => bloomCanopy(340, 16), 1100);

        setTimeout(() => dedication.classList.add("show"), 3300);
        setTimeout(() => bottomLine.classList.add("show"), 3300);
        setTimeout(() => footer.classList.add("show"), 3400);

        setTimeout(() => addLine(lines[0]), 3600);
        setTimeout(() => addLine(lines[1]), 6600);
        setTimeout(() => addLine(lines[2]), 9600);
        setTimeout(() => addLine(lines[3]), 12600);

        setTimeout(() => startFalling(), 4700);
      }

      // apertura por cualquier toque (muy compatible con WebView)
      startOverlay.onclick = openCard;
      startPanel.onclick = openCard;
      startBtn.onclick = openCard;
      document.body.onclick = () => {
        if (startOverlay.style.display !== "none") openCard();
      };

      function addLine(text){
        const p = document.createElement("p");
        p.className = "line";
        p.textContent = text;
        messageBox.appendChild(p);
        requestAnimationFrame(() => p.classList.add("show"));
      }

      // contador (usa hora del teléfono)
      const startDate = new Date(2025, 2, 1, 0, 0, 0); // 1 Mar 2025 (mes 2 = marzo)
      const daysEl  = $("#days"), hoursEl=$("#hours"), minsEl=$("#mins"), secsEl=$("#secs");

      function tick(){
        const diff = Math.max(0, Date.now() - startDate.getTime());
        const totalSec = Math.floor(diff/1000);
        const days = Math.floor(totalSec / 86400);
        const hours = Math.floor((totalSec % 86400)/3600);
        const mins = Math.floor((totalSec % 3600)/60);
        const secs = totalSec % 60;

        daysEl.textContent = String(days);
        hoursEl.textContent = String(hours).padStart(2,"0");
        minsEl.textContent  = String(mins).padStart(2,"0");
        secsEl.textContent  = String(secs).padStart(2,"0");
      }
      tick();
      setInterval(tick, 1000);

      // copa corazones
      const palette = ["var(--h1)","var(--h2)","var(--h3)","var(--h4)","var(--h5)"];
      const rand = (min,max)=> Math.random()*(max-min)+min;
      const pick = (arr)=> arr[(Math.random()*arr.length)|0];

      function createHeartEl(cls){
        const el = document.createElement("span");
        el.className = "heart " + cls;
        el.style.background = pick(palette);
        const size = rand(9, 19);
        el.style.width  = size + "px";
        el.style.height = size + "px";
        el.style.opacity = String(rand(0.78, 0.98));
        return el;
      }
      function heartPoint(t){
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
        return {x,y};
      }
      function spawnCanopyHeart(){
        const W = canopyZone.clientWidth || 390;
        const H = canopyZone.clientHeight || 260;

        const t = rand(0, Math.PI*2);
        const p = heartPoint(t);
        const fill = Math.pow(Math.random(), 0.46);

        const x = p.x * fill;
        const y = p.y * fill;
        const nx = (x + 16) / 32;
        const ny = 1 - ((y + 17) / 30);

        const el = createHeartEl("canopy");
        el.style.left = (nx * W + rand(-12, 12)) + "px";
        el.style.top  = (ny * H + rand(-12, 12)) + "px";
        canopyZone.appendChild(el);
      }
      function bloomCanopy(total=340, intervalMs=16){
        canopyZone.innerHTML = "";
        let count = 0;
        const timer = setInterval(() => {
          for (let i=0;i<4 && count<total;i++){
            spawnCanopyHeart();
            count++;
          }
          if (count >= total) clearInterval(timer);
        }, intervalMs);
      }
      function startFalling(){
        function spawnFall(){
          const W = canopyZone.clientWidth || 390;
          const H = canopyZone.clientHeight || 260;
          const el = createHeartEl("fall");
          el.style.left = rand(W*0.10, W*0.90) + "px";
          el.style.top  = rand(H*0.05, H*0.70) + "px";
          el.style.setProperty("--dur",  rand(6.2, 10.0) + "s");
          el.style.setProperty("--sway", rand(10, 30) + "px");
          el.style.setProperty("--spin", rand(-220, 260) + "deg");
          canopyZone.appendChild(el);
          setTimeout(()=> el.remove(), 12000);
        }
        setInterval(() => {
          const n = Math.random() < 0.40 ? 2 : 1;
          for (let i=0;i<n;i++) spawnFall();
        }, 240);
      }

    }catch(err){
      showError(err);
    }
  })();
  </script>
</body>
</html>
